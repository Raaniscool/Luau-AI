[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dukeotr-pipeline"
version = "0.1.0"
description = "Auditable Roblox/Luau specialization data and evaluation pipeline for Qwen3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DukeOTR contributors"}]
keywords = ["roblox", "luau", "ollama", "qwen", "lora", "qlora"]

[project.optional-dependencies]
training = [
  "torch>=2.5",
  "transformers>=4.51,<5",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.14",
  "trl>=0.15",
  "bitsandbytes>=0.45",
  "safetensors>=0.4",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
